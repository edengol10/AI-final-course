name: Export and deploy production snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

# Never cancel an upload in progress. A newer run waits, then re-exports from the
# source of truth before it can replace the current verified deployment.
concurrency:
  group: airfoil-pages-production
  cancel-in-progress: false

jobs:
  export-validate-deploy:
    name: Export, validate, scan, and direct upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WANDB_ENTITY: ${{ vars.WANDB_ENTITY }}
      WANDB_PROJECT: ${{ vars.WANDB_PROJECT }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

    steps:
      - name: Check required deployment inputs
        shell: bash
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for input_name in WANDB_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID WANDB_ENTITY WANDB_PROJECT CLOUDFLARE_PAGES_PROJECT; do
            if [[ -z "${!input_name:-}" ]]; then
              echo "::error::Missing required deployment input: ${input_name}"
              exit 1
            fi
          done

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frontend dependencies
        run: npm ci

      - name: Install validated exporter
        run: python -m pip install --disable-pip-version-check --editable .

      - name: Export reviewed W&B runs
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: >-
          python -B scripts/export_snapshot.py live
          --registry config/wandb-runs.yaml
          --output public/data

      - name: Revalidate published snapshot offline
        run: >-
          python -B scripts/export_snapshot.py validate
          --manifest public/data/manifest.json

      - name: Build production site
        run: npm run build

      - name: Scan exact deploy output
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          python -B scripts/scan_build.py dist
          --secret-env WANDB_API_KEY
          --secret-env CLOUDFLARE_API_TOKEN
          --secret-env CLOUDFLARE_ACCOUNT_ID

      # Direct Upload creates a new atomic deployment. This is intentionally the
      # final step so any earlier failure leaves the last good deployment live.
      - name: Deploy verified output to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ github.sha }}
