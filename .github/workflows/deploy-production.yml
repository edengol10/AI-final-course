name: Deploy committed fixture to public GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Deny every token capability by default; each job receives only what it uses.
permissions: {}

# Fixture and optional live-data workflows share this group. Never interrupt a
# Pages deployment after it starts; a newer run waits for the current one.
concurrency:
  group: airfoil-github-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package committed synthetic fixture
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    env:
      VITE_BASE_PATH: /AI-final-course/

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frontend dependencies
        run: npm ci

      - name: Install validated fixture exporter
        run: python -m pip install --disable-pip-version-check --editable .

      - name: Rebuild the committed fixture with the restricted public profile
        run: >-
          python -B scripts/export_snapshot.py fixture
          --registry config/wandb-runs.yaml
          --fixture tests/fixtures/wandb_history_v1.json
          --output public/data
          --generated-at 2026-08-10T00:00:00Z

      - name: Require and validate the restricted synthetic fixture
        run: |
          python -B scripts/export_snapshot.py validate --manifest public/data/manifest.json
          python -c 'import json, pathlib; manifest=json.loads(pathlib.Path("public/data/manifest.json").read_text()); assert manifest.get("snapshotKind") == "synthetic-fixture", "default Pages deployment accepts only snapshotKind=synthetic-fixture"'

      - name: Build public fixture site for the project subpath
        run: npm run build

      - name: Self-test and scan exact public artifact
        run: |
          python -B scripts/scan_build.py --self-test
          python -B scripts/scan_build.py dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish synthetic fixture publicly
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
